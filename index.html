<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Interactive Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 30px;
      text-align: center;
      background: #ffffff;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 30px;
    }

    button {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      font-size: 18px;
      background: white;
      border: 2px solid #333;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #f2f2f2;
    }

    #feedback {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>What is “house” in Spanish?</h2>

  <button onclick="checkAnswer(true)">Casa</button>
  <button onclick="checkAnswer(false)">Mesa</button>
  <button onclick="checkAnswer(false)">Silla</button>

  <div id="feedback"></div>

  <script>
    function checkAnswer(correct) {
      const feedback = document.getElementById("feedback");

      if (correct) {
        feedback.textContent = "✅ ¡Correcto!";
      } else {
        feedback.textContent = "❌ Inténtalo otra vez.";
      }
    }
  </script>

</body>
</html>
